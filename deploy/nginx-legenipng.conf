# legenipng.legeniconsulting.cm -> plateforme de test IA image (conteneur legenipng, 127.0.0.1:9650)
limit_req_zone $binary_remote_addr zone=legenipng_api:10m rate=12r/m;

server {
    listen 80;
    server_name legenipng.legeniconsulting.cm;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name legenipng.legeniconsulting.cm;

    ssl_certificate /etc/letsencrypt/live/legenipng.legeniconsulting.cm/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/legenipng.legeniconsulting.cm/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/log/nginx/legenipng.access.log;
    error_log /var/log/nginx/legenipng.error.log;

    add_header Strict-Transport-Security "max-age=31536000" always;

    # image source (15 Mo max) + image de fond éventuelle (15 Mo max)
    client_max_body_size 32m;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # calcul sur CPU : on limite la cadence par adresse IP
    location = /api/process {
        limit_req zone=legenipng_api burst=6 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:9650;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    location / {
        proxy_pass http://127.0.0.1:9650;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
